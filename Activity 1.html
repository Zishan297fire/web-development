<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                right: 30px;
                border: 3px solid #73ad21;
            }
            div.absolute{
                position: absolute;
                left: 50px;
                border: 3px solid blue;
            }
            div.relative{
            position: relative;
            left: 100px;
            border: #73ad21;
            }
            div{
                position: sticky;
                top: 1px;
                left: 20px;
                width: 100px;
                border: 3px solid #73ad21;
            }
        </style>
    </head>
    <body>
        <h2>
            positioning
        </h2>
        <div>
            div with no position property
        </div>
        <div class="sticky">
             div with sticky position property
        </div>
        <div class="relative">
            This div element has position:relative ;
        </div>
        <div class="absolute">
            absolute class DIV
        </div>
        <div class="fixed">
            Div with fixed position property
        </div>
    </body>
</html>
