<!DOCTYPE html>
<html>
    <body>
        <h2>
            JS array methods
        </h2>
        <h2>
            join() and pop()
        </h2>
        <P>
            the join () methods join aray elements into a string and the pop() method removes the last element from array.
        </P>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            var fruits=["bannan","apple","orange","mango"];
            document.getElementById("myjoin").innerHTML=fruits;
             document.getElementById("myfirstpop").innerHTML=fruits;
             fruits.pop();
              document.getElementById("mysecondpop").innerHTML=fruits;
        </script>
    </body>
</html>
