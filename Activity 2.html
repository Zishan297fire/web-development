<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                background-color: #4caf50;
                padding: 10px;
            }
            div .first{
                opacity: 0.1;
            }
            div.second{
                opacity: 0.3;
            }
             div.third{
                opacity: 0.6;
            }
        </style>
    </head>
    <body>
        <h1>
            the opacity property
        </h1>
        <div class="first"><p>opacity0.1</p></div>
        <div class="second"><p>opacity0.1</p></div>
        <div class="third"><p>opacity0.1</p></div>
        <div><p>opacity0.1</p></div>
    </body>
</html>
