<!DOCTYPE html>
<html>
    <body>
        <h2>
            JS Arrow Function
        </h2>
        <p>
           This example shows an arrow Function with a parameter
        <p id="result"></p>
        <script>
        const add = (a,b) => a + b
        document.getElementById("result").innerHTML =add(4,6)
        </script>
    </body>
</html>
