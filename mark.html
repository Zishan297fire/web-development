<html lang="en">

<head>

<title>

Bootstrap Typography example

</title>

<meta charset="utf-8">

<meta name="viewport"

content="width=device-width, initial-scale=1">

<link rel="stylesheet" href=

"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<script src=

"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script>

</head>
<body>
    <p>
        CO<sub>2</sub>
    </p>
    <p>
        a<sup>2</sup>
    </p>
    <div class="container">
        <h1>
            Highlight Text
        </h1>
        <p>
            use mark element to<mark>Highlight</mark> text.
        </p>
    </div>
    <div class="container">
        <h1>
            Code snippets
        </h1>
        <p>
            Inline snippets of code should be embedded in code element:
        </p>
        <p>
            The following HTML elements: <code>span</code>,<code>section</code>,and <code>
           define a section in a document.
            </code>
        </p>
    </div>
</body>
