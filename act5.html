<!DOCTYPE html>
<html>
    <body>
        <p>
            A function can access variables define inside the function
        </p>
        <button onclick="myFunction() "type="button">
        Click Me 
        </button>
        <p id="demo">

        </p>
         <p id="demo1">

        </p>
         <p id="demo2">

        </p>
        <script>
            var b=5;
            function myfunction(){
                var a=4;
                document.getElmentById("demo").innerHTML=b*a;
            }
              document.getElmentById("demo1").innerHTML=a;
                document.getElmentById("demo2").innerHTML=b;
        </script>
    </body>
</html>
