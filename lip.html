<!DOCTYPE html>
<html>
    <body>
        <h2>
            java script for loop
        </h2>
        <p id="demo">

        </p>
        <script>
            var fruits=["Apple","Mango","Grapes","WaterMelon","Jackfruit","Bannana"]
            var text=""
            var i
           for(i=0;i<fruits.length; i++) {
            text+=fruits[i] + "<br>";
           }
           document.getElementById("demo").innerHTML=text;
        </script>
    </body>
</html>
